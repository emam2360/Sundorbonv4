name: Build Sundarban Drug House APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout source
        uses: actions/checkout@v4


      # =========================================================
      # 2. Node.js
      # =========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # =========================================================
      # 3. Java
      # =========================================================
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'


      # =========================================================
      # 4. Install dependencies
      # =========================================================
      - name: Install dependencies
        run: npm install


      # =========================================================
      # 5. TypeScript
      # =========================================================
      - name: Install TypeScript
        run: npm install -D typescript


      # =========================================================
      # 6. Capacitor Android
      # =========================================================
      - name: Install Capacitor Android
        run: npm install @capacitor/android@8.5.2


      # =========================================================
      # 7. Build web application
      # =========================================================
      - name: Prepare web files
        run: npm run build


      # =========================================================
      # 8. Add Android platform
      # =========================================================
      - name: Add Android platform
        run: npx cap add android


      # =========================================================
      # 9. Sync Capacitor
      # =========================================================
      - name: Sync Capacitor
        run: npx cap sync android


      # =========================================================
      # 10. Android Back Button
      #
      # Inside pages:
      # Back -> previous page
      #
      # Home/root:
      # Back -> exit confirmation
      #
      # Yes -> close
      # No -> stay
      # =========================================================
      - name: Configure Android Back Button
        shell: bash
        run: |
          set -e

          MAIN_ACTIVITY=$(find android/app/src/main/java \
            -name "MainActivity.java" | head -n 1)

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "MainActivity.java not found."
            exit 1
          fi

          echo "Using MainActivity:"
          echo "$MAIN_ACTIVITY"

          PACKAGE_PATH=$(dirname "$MAIN_ACTIVITY" \
            | sed 's#android/app/src/main/java/##')

          PACKAGE_NAME=$(echo "$PACKAGE_PATH" | tr '/' '.')

          echo "Detected package: $PACKAGE_NAME"

          cat > "$MAIN_ACTIVITY" <<EOF
          package $PACKAGE_NAME;

          import android.os.Bundle;
          import android.webkit.WebView;

          import androidx.appcompat.app.AlertDialog;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              private boolean isExitDialogShowing = false;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
              }

              @Override
              public void onBackPressed() {

                  WebView webView = null;

                  try {
                      if (getBridge() != null) {
                          webView = getBridge().getWebView();
                      }
                  } catch (Exception ignored) {
                  }

                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                      return;
                  }

                  if (isExitDialogShowing) {
                      return;
                  }

                  isExitDialogShowing = true;

                  new AlertDialog.Builder(this)
                          .setTitle("অ্যাপ থেকে বের হবেন?")
                          .setMessage("আপনি কি সত্যিই অ্যাপ থেকে বের হতে চান?")
                          .setPositiveButton("হ্যাঁ", (dialog, which) -> {
                              isExitDialogShowing = false;
                              finishAndRemoveTask();
                          })
                          .setNegativeButton("না", (dialog, which) -> {
                              isExitDialogShowing = false;
                              dialog.dismiss();
                          })
                          .setOnCancelListener(dialog -> {
                              isExitDialogShowing = false;
                          })
                          .show();
              }
          }
          EOF

          echo "Final MainActivity.java:"
          cat "$MAIN_ACTIVITY"


      # =========================================================
      # 11. Sync again after Android configuration
      # =========================================================
      - name: Sync Capacitor after Android configuration
        run: npx cap sync android


      # =========================================================
      # 12. Build APK
      # =========================================================
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon


      # =========================================================
      # 13. Upload APK
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sundarban-Drug-House-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
